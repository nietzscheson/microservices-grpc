services:
  postgres:
    image: postgres:17.4
    container_name: postgres
    ports:
      - "6543:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: users,products,orders
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./docker/postgres/multiple-databases.sh:/docker-entrypoint-initdb.d/multiple-databases.sh

  user:
    container_name: user
    build:
      context: .
      dockerfile: ./services/Dockerfile
      target: user
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/users
      GRPC_PORT: 50051
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import grpc; ch=grpc.insecure_channel('localhost:50051'); grpc.channel_ready_future(ch).result(timeout=2)\" || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 5
    volumes:
      - ./services/user:/services/user
    ports:
      - 50051:50051
    depends_on:
      postgres:
        condition: service_healthy

  product:
    container_name: product
    build:
      context: .
      dockerfile: ./services/Dockerfile
      target: product
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/products
      GRPC_PORT: 50051
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import grpc; ch=grpc.insecure_channel('localhost:50051'); grpc.channel_ready_future(ch).result(timeout=2)\" || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 5
    volumes:
      - ./services/product:/services/product
    ports:
      - 50052:50051
    depends_on:
      postgres:
        condition: service_healthy

  order:
    container_name: order
    build:
      context: .
      dockerfile: ./services/Dockerfile
      target: order
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/orders
      GRPC_PORT: 50051
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import grpc; ch=grpc.insecure_channel('localhost:50051'); grpc.channel_ready_future(ch).result(timeout=2)\" || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 5
    volumes:
      - ./services/order:/services/order
    ports:
      - 50053:50051
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    container_name: gateway
    build:
      context: .
      dockerfile: ./gateway/Dockerfile
      target: gateway
    environment:
      USER_SERVICE_URL: user:50051
      PRODUCT_SERVICE_URL: product:50051
      ORDER_SERVICE_URL: order:50051
    ports:
      - "4000:4000"
    volumes:
      - ./gateway:/gateway
    depends_on:
      user:
        condition: service_healthy
      product:
        condition: service_healthy
      order:
        condition: service_healthy
